{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña - TiendaDamas</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <form class="form" method="post">
        {% csrf_token %}
        <p id="heading">Recuperar contraseña</p>

        {% if messages %}
            {% for m in messages %}
                <p class="error">{{ m }}</p>
            {% endfor %}
        {% endif %}

        <div class="field">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"></path>
            </svg>
            <input autocomplete="off" name="username" placeholder="Usuario" class="input-field"
                   type="text" value="{{ username }}" required>
        </div>

        <div class="field">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path>
            </svg>
            <input autocomplete="off" name="documento" placeholder="Cédula" class="input-field"
                   type="text" maxlength="50" required>
        </div>

        <div class="btn">
            <button class="button1" type="submit">Enviar contraseña temporal</button>
        </div>
        <button class="button3" type="button" onclick="window.location='{% url 'login' %}'">
            Volver al inicio de sesión
        </button>
    </form>
</body>
</html>
